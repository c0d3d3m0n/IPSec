services:
  - type: web
    name: ipsec-orchestrator
    runtime: docker
    plan: free # Can be upgraded to 'starter' or higher for production
    region: ohio
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ipsec-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PROJECT_NAME
        value: Unified IPsec Orchestrator

databases:
  - name: ipsec-db
    plan: free
    region: ohio
