<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Light Emerald to Soft Mint Theme Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Subtle Hacker Glow -->
    <filter id="emeraldGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Core Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#080C0A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Pitch Black / Deep Carbon Background -->
  <rect width="512" height="512" rx="64" fill="#080C0A" />

  <!-- Soft Ambient Glow behind Shield -->
  <circle cx="256" cy="270" r="180" fill="url(#centerGlow)" />

  <!-- ── SHIELD & CIRCUIT NODE GEOMETRY ── -->
  <g filter="url(#emeraldGlow)">
    <!-- Main Continuous Shield Contour & Circuit Path -->
    <!-- Path 1: From left shoulder, through bottom tip, to right shoulder, turning into center node -->
    <path d="M 124,204 
             C 126,306 182,382 256,420 
             C 330,382 386,306 388,204 
             C 356,204 316,182 300,166 
             L 262,246" 
          fill="none" 
          stroke="url(#shieldGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Path 2: Upper arm from left shoulder connecting into top node -->
    <path d="M 124,204 
             C 148,222 208,212 242,162" 
          fill="none" 
          stroke="url(#shieldGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Top Circuit Node (Outer ring + hollow center) -->
    <circle cx="256" cy="138" r="36" fill="url(#shieldGrad)" />
    <circle cx="256" cy="138" r="16" fill="#080C0A" />

    <!-- Center Circuit Node (Outer ring + hollow center) -->
    <circle cx="256" cy="272" r="36" fill="url(#shieldGrad)" />
    <circle cx="256" cy="272" r="16" fill="#080C0A" />
  </g>
</svg>